name: update-channels
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-channels
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node update-channels.mjs
        env:
          ARAB_ONLY: '1'
          PRUNE_NON_ARAB: '0'
      - name: commit
        run: |
          git config user.name "channels-bot"
          git config user.email "bot@users.noreply.github.com"
          git add channels.json status.json update-info.json
          git diff --cached --quiet || (git commit -m "update channels" && git push)
