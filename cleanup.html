<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تنظيف القنوات الخاصة</title>
<style>
body{font-family:sans-serif;background:#141414;color:#fff;padding:20px;line-height:1.9;font-size:15px}
input{width:100%;padding:12px;margin:6px 0;background:#333;border:none;border-radius:6px;color:#fff;box-sizing:border-box}
button{padding:13px 16px;border:0;border-radius:6px;background:#e50914;color:#fff;font-size:15px;margin:8px 0;width:100%}
button:disabled{opacity:.5}
.ok{color:#46d369}.bad{color:#ff6b6b}.m{color:#999;font-size:13px}
#out{white-space:pre-line;margin-top:14px}
</style>
</head>
<body>
<h2>🧹 تنظيف القنوات الخاصة</h2>
<p class="m">أداة خفيفة ومنفصلة عن الموقع الرئيسي، لحذف القنوات الخاصة مباشرة حتى لو كان الموقع الأساسي بطيئاً أو متجمداً بسبب كمية كبيرة من القنوات.</p>

<div id="loginBox">
  <input id="em" type="email" placeholder="بريد المدير">
  <input id="pw" type="password" placeholder="كلمة المرور">
  <button id="loginBtn">تسجيل الدخول</button>
</div>

<div id="toolBox" style="display:none">
  <p>مسجَّل الدخول كـ <b id="who"></b></p>
  <button id="countBtn">📊 عدد القنوات الخاصة الحالي</button>
  <button id="delBtn" style="background:#b71c1c">🗑️ حذف كل القنوات الخاصة نهائياً</button>
</div>

<div id="out"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyB_q5oVLcsJatJhhjLhzPOfSSjodMac258",
    authDomain: "iptv-platform-683da.firebaseapp.com",
    projectId: "iptv-platform-683da",
    storageBucket: "iptv-platform-683da.firebasestorage.app",
    messagingSenderId: "776346779345",
    appId: "1:776346779345:web:7b55ff2676c0aa1752cff0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const out = document.getElementById('out');
const log = (t, cls) => { const d = document.createElement('div'); if(cls) d.className = cls; d.textContent = t; out.appendChild(d); };

document.getElementById('loginBtn').onclick = async () => {
    try { await auth.signInWithEmailAndPassword(document.getElementById('em').value.trim(), document.getElementById('pw').value); }
    catch(e) { log('❌ ' + e.message, 'bad'); }
};
auth.onAuthStateChanged(user => {
    document.getElementById('loginBox').style.display = user ? 'none' : 'block';
    document.getElementById('toolBox').style.display = user ? 'block' : 'none';
    if(user) document.getElementById('who').textContent = user.email;
});

document.getElementById('countBtn').onclick = async () => {
    out.innerHTML = ''; log('⏳ جاري العدّ...');
    try {
        const snap = await db.collection('privateChannels').get();
        out.innerHTML = '';
        log('📊 العدد الحالي: ' + snap.size + ' قناة خاصة.', snap.size > 2000 ? 'bad' : 'ok');
    } catch(e) { out.innerHTML = ''; log('❌ ' + e.message + ' (تأكد من نشر قواعد privateChannels وتوثيق البريد)', 'bad'); }
};

document.getElementById('delBtn').onclick = async () => {
    if(!confirm('حذف كل القنوات الخاصة نهائياً؟ لا يمكن التراجع.')) return;
    const btn = document.getElementById('delBtn'); btn.disabled = true;
    out.innerHTML = ''; log('⏳ جاري الجلب والحذف...');
    try {
        let total = 0, round = 0;
        for(;;) {
            const snap = await db.collection('privateChannels').limit(400).get();
            if(snap.empty) break;
            const b = db.batch();
            snap.docs.forEach(d => b.delete(d.ref));
            await b.commit();
            total += snap.size; round++;
            out.innerHTML = ''; log('⏳ حُذف حتى الآن: ' + total + ' (دفعة ' + round + ')');
        }
        out.innerHTML = '';
        log('✅ تم الحذف الكامل: ' + total + ' قناة خاصة.', 'ok');
        log('افتح الموقع الرئيسي الآن، سيعمل بسرعته الطبيعية.');
    } catch(e) { log('❌ توقف الحذف: ' + e.message, 'bad'); }
    btn.disabled = false;
};
</script>
</body>
</html>
